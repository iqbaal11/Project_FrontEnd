<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Expense Tracker</title>
    <link rel="stylesheet" href="style.css" />
    <link
      href="https://fonts.googleapis.com/css?family=Poppins:100,100italic,200,200italic,300,300italic,regular,italic,500,500italic,600,600italic,700,700italic,800,800italic,900,900italic"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="container">
      <h1>Expense Tracker</h1>

      <div class="balance-container">
        <h2>Your Balance</h2>
        <h1 id="balance">$0.00</h1>

        <div class="summary">
          <div class="income">
            <h3>Income</h3>
            <p id="income-amount">$0.00</p>
          </div>
          <div class="expenses">
            <h3>Expenses</h3>
            <p id="expense-amount">$0.00</p>
          </div>
        </div>
      </div>

      <div class="main-content">
        <div class="transaction-container">
          <h2>Transactions</h2>
          <ul id="transaction-list">
            <!-- membuat daftar kogong di halaman web dengan id=transaction-list -->
            <!-- ul = unorderd list = daftar tanpa urutan (bullet points). dilayar akan terlihat sebagai daftar dengan tanda titik (.) secara dafault -->
            <!-- data transaksi akan dimasukan disini -->
          </ul>
        </div>

        <div class="form-container">
          <h2>Add Transaction</h2>

          <form id="transaction-form">
            <!-- <form> elemen HTML yang menjadi wadah untuk kontrol input -->
            <!-- id="transaction-form" agar JS bisa menambah dan mengelola transaksi -->
            <div class="form-group">
              <label for="description">Description</label>
              <!-- label = tag HTML yang memberi nama atau keterangan untuk elemen form -->
              <!-- fungsinya mirip tulisan "judul di samping kolom isian supaya user tahu apa yang harus di isi" -->
              <!-- atribut for menghubungkan <label> ke elemen form lain yang memiliki id="description" -->
              <!-- jadi for="description" berarti : label ini menerangkan elemen yang id-nya = description -->
              <!-- jika user klik teks description, browser akan memfokuskan crusor pada elemen input -->
              <input type="text" id="description" placeholder="Enter description..." required />
              <!-- input = tag HTML memungkinkan user memasukan data -->
              <!-- type="text" menentukan tipe data input  -->
              <!-- id="description" menghubungkan dengan label, agar bisa berhubungan dengan JS dan CSS -->
              <!-- attribut required membuat form filed wajib diisi -->
            </div>

            <div class="form-group">
              <label for="amount">Amount</label>
              <input type="number" id="amount" placeholder="Enter amount..." required />
              <small>Use negative (-) for expenses</small>
              <!-- digunakan untuk menampilkan teks kecil, sebagai catatan atau keterangan tambahan -->
            </div>

            <button type="submit">Add Transaction</button>
            <!-- button = tag HTML untuk membuat tombol -->
            <!-- type="submit" menentukan bahwa tombol ini adalah tombol submit -->
          </form>
        </div>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
